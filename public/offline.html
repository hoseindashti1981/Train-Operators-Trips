<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>لوحه‌ساز — آفلاین</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d10;
        color: #f1f2f4;
        font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        border: 1px solid rgb(241 242 244 / 12%);
        background: #13161c;
        border-radius: 24px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #9aa0a8;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 20px;
        height: 44px;
        align-items: center;
        padding: 0 16px;
        border-radius: 8px;
        background: #c5ccd6;
        color: #0b0d10;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>اتصال نیست</h1>
      <p>
        لوحه‌ساز روی این دستگاه نصب شده است. بعد از یک‌بار باز شدن آنلاین، پردازش فایل اکسل بدون اینترنت هم کار می‌کند.
      </p>
      <a href="./">تلاش دوباره</a>
    </main>
  </body>
</html>
